<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 240px;
            margin: 0;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eaeaea;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .label-text {
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        /* Modern Toggle Switch Styling */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #37ADFF;
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="../icons/icon.svg" alt="Icon" width="20">
        <span>Persistent Containers</span>
    </div>

    <div class="setting-row">
        <label class="toggle-switch">
            <input type="checkbox" id="openNextToCurrent" checked>
            <span class="slider"></span>
        </label>
        <label for="openNextToCurrent" class="label-text">Open next to current tab</label>
    </div>

    <script src="popup.js"></script>
    
</body>

</html>
