<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        border: 1px solid rgb(207, 207, 207);
        background-color: #ffffff;
        padding: 12px;
        width: 240px;
        color: #333;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        border-bottom: 1px solid #eaeaea;
        padding-bottom: 6px;
        font-weight: 600;
        font-size: 9px;
      }

      .setting-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
      }

      .setting-row:hover .toggle-switch {
        transform: scale(1.05);
      }

      .label-text {
        cursor: pointer;
        font-size: 13px;
        user-select: none;
      }

      /* Modern Toggle Switch Styling */
      .toggle-switch {
        display: inline-block;
        position: relative;
        width: 36px;
        height: 20px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transition: 0.3s;
        cursor: pointer;
        border-radius: 20px;
        background-color: #ccc;
      }

      .slider:before {
        position: absolute;
        bottom: 3px;
        left: 3px;
        transition: 0.3s;
        border-radius: 50%;
        background-color: white;
        width: 14px;
        height: 14px;
        content: "";
      }

      input:checked + .slider {
        background-color: #37adff;
      }

      input:checked + .slider:before {
        transform: translateX(16px);
      }

      input[type="checkbox"]:focus-visible + .slider {
        outline: 2px solid #005fcc;
        outline-offset: 2px;
      }

      .link-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin-top: 20px;
        font-size: 0.8rem;
      }

      a {
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      /* --- Automatic Dark Mode Theme --- */
      @media (prefers-color-scheme: dark) {
        body {
          border: 1px solid rgb(118, 118, 118);
          background-color: #1f1f1f;
          color: #f1f1f1;
        }

        header {
          border-bottom: 1px solid #3a3a3a;
        }

        .slider {
          background-color: #555;
        }

        input[type="checkbox"]:focus-visible + .slider {
          outline: 2px solid #66beff;
        }
      }
    </style>
  </head>

  <body>
    <header role="banner">
      <img src="../icons/icon.svg" alt="Icon" width="20" aria-hidden="true" />
      <h1>Persistent Containers</h1>
    </header>

    <div class="setting-row" role="group" aria-labelledby="toggleLabel">
      <label class="toggle-switch">
        <input
          type="checkbox"
          id="openNextToCurrent"
          checked
          role="switch"
          aria-checked="true"
          aria-labelledby="toggleLabel"
        />
        <span class="slider" aria-hidden="true"></span>
      </label>
      <label id="toggleLabel" for="openNextToCurrent" class="label-text">
        Open next to current tab
      </label>
    </div>

    <div class="link-container" aria-label="Footer links">
      <a
        href="https://github.com/navchandar/persistent-containers"
        aria-label="View the source code on GitHub"
        target="_blank"
        rel="noopener noreferrer"
        >Source</a
      >
      <span style="color: #ccc" aria-hidden="true">|</span>
      <a
        href="https://navchandar.github.io/persistent-containers/"
        aria-label="Visit our help and support documentation"
        target="_blank"
        rel="noopener noreferrer"
        >Help</a
      >
    </div>

    <script src="popup.js"></script>
  </body>
</html>
