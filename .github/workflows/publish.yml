name: Publish to Firefox Add-ons

# Runs when a new release is created in GitHub
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed if uploading assets to the GitHub Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Build Extension Package
        run: |
          mkdir -p ./web-ext-artifacts
          # Builds the package (.zip)
          web-ext build --source-dir . --artifacts-dir ./web-ext-artifacts --overwrite-dest
          
          # Create an .xpi copy of the build (an .xpi is just a zip archive)
          cd ./web-ext-artifacts
          for f in *.zip; do
            cp "$f" "${f%.zip}.xpi"
          done

      # Upload to GitHub Actions Run Artifacts (accessible in Actions tab)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: web-ext-artifacts
          path: ./web-ext-artifacts/*
          retention-days: 14

      # Attach the .xpi directly to the GitHub Release page
      - name: Attach XPI to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ./web-ext-artifacts/*.xpi

      # Submit to AMO store
      - name: Publish to Mozilla Add-ons
        env:
          WEB_EXT_VERBOSE: "true"
        run: |
          web-ext sign \
            --source-dir . \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=listed
            # --channel=listed publishes it publicly to the store.
