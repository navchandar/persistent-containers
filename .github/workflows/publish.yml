name: Publish to Firefox Add-ons

# Runs when a new release is created in GitHub
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Build the Extension Zip
        run: web-ext build --source-dir . --artifacts-dir ./web-ext-artifacts

      - name: Publish to Mozilla Add-ons
        env:
          WEB_EXT_VERBOSE: "true"
        run: |
          web-ext sign \
            --source-dir . \
            --api-key=${{ secrets.AMO_JWT_ISSUER }} \
            --api-secret=${{ secrets.AMO_JWT_SECRET }} \
            --channel=listed
        # --channel=listed publishes it publicly to the store.
